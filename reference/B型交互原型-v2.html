function catOf(id){return CATS.find(x=>x.id===id)||CATS[0]}

 const target=g.href.toLowerCase();

function renderCard(g){const openLabel=launchLabel(g);return `<article class="resource-card" data-id="${g.id}">${thumb(g)}<div class="card-info"><div class="card-top"><span class="card-title">${esc(cardTitle(g))}</span>${g.status==='liked'?`<span class="status ok"><span class="status-dot"></span>${esc(statusLabel(g.status))}</span>`:''}</div><p class="card-description">${esc(description(g))}</p><div class="pills"><span class="pill category">${esc(categoryName(g.category))}</span><span class="pill">0～3岁范围</span><span class="pill lang">${esc(languageLabel(g.language))}</span><span class="pill">${esc(platformLabel(g.platform))}</span></div></div><div class="card-actions"><a class="primary" href="${esc(g.href)}" target="_blank" rel="noopener noreferrer">${esc(openLabel)} ↗</a><button type="button" class="secondary-link" data-detail="${g.id}">${esc(fmt('viewDetail'))} · <span class="status ${statusClass(g.status)}"><span class="status-dot"></span>${esc(statusLabel(g.status))}</span></button></div></article>`}
function render(){document.documentElement.lang=st.locale==='zh'?'zh-CN':'en';document.title=fmt('brand')+' · Interactive Prototype';document.querySelectorAll('[data-i18n]').forEach(el=>{if(el.id==='resultTitle')return;el.textContent=fmt(el.dataset.i18n)});$('search').placeholder=fmt('placeholder');$('clearSearch').classList.toggle('visible',!!st.search);$('zhSwitch').classList.toggle('active',st.locale==='zh');$('enSwitch').classList.toggle('active',st.locale==='en');$('zhSwitch').setAttribute('aria-pressed',String(st.locale==='zh'));$('enSwitch').setAttribute('aria-pressed',String(st.locale==='en'));$('allCount').textContent=GAMES.length;renderCategories();renderOptions();const entries=filtered();$('resultTitle').firstChild.textContent=fmt('resultTitle')+' ';$('resultCount').textContent=fmt('matches').replace('{n}',entries.length);$('cards').className='resource-list'+(st.layout==='grid'?' grid':'');$('cards').innerHTML=entries.length?entries.map(renderCard).join(''):`<div class="empty"><div style="font-size:38px">🔎</div><strong>${fmt('noResults')}</strong><p>${fmt('emptySub')}</p><button class="ghost-btn" id="emptyReset" style="margin-top:13px">${fmt('reset')}</button></div>`;$('listView').classList.toggle('active',st.layout==='list');$('gridView').classList.toggle('active',st.layout==='grid');$('listView').setAttribute('aria-pressed',String(st.layout==='list'));$('gridView').setAttribute('aria-pressed',String(st.layout==='grid'));const af=[];if(st.category!=='all')af.push(categoryName(st.category));if(st.platform!=='all')af.push(platformLabel(st.platform));if(st.language!=='all')af.push(languageLabel(st.language));if(st.status!=='all')af.push(statusLabel(st.status));$('activeFilters').classList.toggle('visible',!!af.length);$('activeFilters').innerHTML=af.map(t=>`<span>${esc(t)}</span>`).join('')+(af.length?`<button class="reset-link" id="resetFilters">${fmt('reset')} ×</button>`:'')}
function reset(){st.category='all';st.platform='all';st.language='all';st.status='all';st.search='';st.sort='featured';$('search').value='';render()}
function drawer(open){$('sidebar').classList.toggle('open',open);$('drawerBackdrop').classList.toggle('open',open);document.body.style.overflow=open?'hidden':''}
function openDetails(id){const g=GAMES.find(x=>x.id===id);if(!g)return;const c=catOf(g.category);$('modalBody').innerHTML=`<div class="detail-top">${thumb(g,'detail-thumb')}<div><h2 id="detailHeading">${esc(cardTitle(g))}</h2><p class="detail-sub">${esc(description(g))}</p><span class="status ${statusClass(g.status)}"><span class="status-dot"></span>${esc(statusLabel(g.status))}</span><div class="facts"><div class="fact"><b>${fmt('platformLabel')}</b>${esc(platformLabel(g.platform))}</div><div class="fact"><b>${fmt('languageLabel')}</b>${esc(languageLabel(g.language))}</div><div class="fact"><b>${fmt('categoryLabel')}</b>${esc(categoryName(c.id))}</div><div class="fact"><b>${fmt('costLabel')}</b>${esc(fmt('free'))}</div></div></div></div><section class="detail-section"><h3>${fmt('usage')}</h3><p>${esc(note(g))}</p></section><section class="detail-section"><h3>${fmt('source')}</h3><p style="word-break:break-all">${esc(g.href)}</p></section><div class="detail-cta"><a class="primary" href="${esc(g.href)}" target="_blank" rel="noopener noreferrer">${esc(launchLabel(g))} ↗</a><button type="button" class="ghost-btn" id="closeInside">${fmt('close')}</button></div><p style="font-size:11px;color:#94a59a;line-height:1.7;margin:17px 0 0">${fmt('linkNote')}</p>`;$('detailDialog').showModal()}
function infoModal(type){$('modalBody').innerHTML=`<h2 id="detailHeading" style="font-size:22px">${fmt(type+'Title')}</h2><p style="line-height:1.9;color:#6c8174;font-size:14px">${fmt(type+'Body')}</p><button class="primary" id="closeInside" style="margin-top:20px">${fmt('close')}</button>`;$('detailDialog').showModal()}
$('search').addEventListener('input',e=>{st.search=e.target.value;render()});$('clearSearch').addEventListener('click',()=>{st.search='';$('search').value='';render();$('search').focus()});$('resetTop').addEventListener('click',reset);
['platform','language','status','sort'].forEach(k=>$(k).addEventListener('change',e=>{st[k]=e.target.value;render()}));
$('listView').addEventListener('click',()=>{st.layout='list';render()});$('gridView').addEventListener('click',()=>{st.layout='grid';render()});
$('zhSwitch').addEventListener('click',()=>{st.locale='zh';render()});$('enSwitch').addEventListener('click',()=>{st.locale='en';render()});
$('openDrawer').addEventListener('click',()=>drawer(true));$('drawerBackdrop').addEventListener('click',()=>drawer(false));
$('closeDialog').addEventListener('click',()=>$('detailDialog').close());$('detailDialog').addEventListener('click',e=>{if(e.target===$('detailDialog'))$('detailDialog').close()});
document.addEventListener('click',e=>{const cat=e.target.closest('[data-cat]');if(cat){st.category=cat.dataset.cat;render();drawer(false);return};const detail=e.target.closest('[data-detail]');if(detail){openDetails(detail.dataset.detail);return};const modal=e.target.closest('[data-modal]');if(modal){infoModal(modal.dataset.modal);return};if(e.target.closest('#resetFilters')||e.target.closest('#emptyReset')){reset();return};if(e.target.closest('#closeInside')){$('detailDialog').close()}});
render();
</script>
</body>
</html>
